name: Build and Deploy

# Reusable workflow for the stackunderflow app platform.
# Builds the container image, pushes it to ghcr.io and updates the deployment
# reference (KRO Application defaultMode image, or a kustomize placeholder
# named "app" for custom mode), then commits the change back to the repo.
#
# Usage in an app repo:
#
#   jobs:
#     deploy:
#       uses: bjorngi/stackunderflow-deploy/.github/workflows/deploy.yaml@main
#       with:
#         image-name: ghcr.io/<owner>/<app>
#       permissions:
#         contents: write
#         packages: write

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      application-file:
        default: .stackunderflow/application.yaml
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Detect deployment mode
        id: detect
        run: |
          if yq -e '.spec.defaultMode.enabled' "${{ inputs.application-file }}" > /dev/null 2>&1; then
            echo "mode=default" >> "$GITHUB_OUTPUT"
          else
            echo "mode=kustomize" >> "$GITHUB_OUTPUT"
            echo "path=$(yq -r '.spec.source.git.path' "${{ inputs.application-file }}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kustomize
        if: steps.detect.outputs.mode == 'kustomize'
        uses: imranismail/setup-kustomize@v2

      - name: Update default mode image
        if: steps.detect.outputs.mode == 'default'
        run: |
          yq -i '.spec.defaultMode.image = "${{ inputs.image-name }}:${{ github.sha }}"' '${{ inputs.application-file }}'

      - name: Update kustomize image
        if: steps.detect.outputs.mode == 'kustomize'
        run: |
          cd "${{ steps.detect.outputs.path }}"
          kustomize edit set image app=${{ inputs.image-name }}:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.detect.outputs.mode }}" = "kustomize" ]; then
            git add "${{ steps.detect.outputs.path }}/kustomization.yaml"
          else
            git add '${{ inputs.application-file }}'
          fi
          git diff --cached --quiet || (
            git commit -m "deploy: ${{ inputs.image-name }}:${{ github.sha }} [skip ci]"
            git push
          )
